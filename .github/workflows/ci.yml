name: Verificação do projeto

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependências
        run: npm install
      - name: Verificar qualidade e acessibilidade do código
        run: npm run lint
      - name: Verificar tipos TypeScript
        run: npx tsc --noEmit
      - name: Compilar aplicação Next.js
        run: npm run build
